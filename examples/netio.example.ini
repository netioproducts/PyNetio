#
# Configuration example for the Netio command line tool.
#
# Use it with `Netio --config netio.ini ...` or set the path in the
# NETIO_CONFIG environment variable.
#


# Values in this section are used for every device, unless the section for
# that device sets its own.
[DEFAULT]
user = admin

# A good way to keep the password off the command line, where anyone on the
# system could see it.
password = superSecret

# Certificate check for HTTPS. It is on by default.
#   cert =                    switch the check off (HTTPS is still used)
#   cert = /path/to/cert.pem  check against this certificate
# A relative path is taken from the folder this file is in.
# cert = /path/to/cert.pem

# If your device uses a self signed certificate, you can also turn off the
# warnings that urllib prints:
# no_cert_warning = true


# Settings for one device. The section name is the host and port from the URL,
# so this one is used for http://powerpdu-8qs.netio-products.com/netio.json
[powerpdu-8qs.netio-products.com]
user = netio
password = netio


# The port is part of the name when the URL has one.
[powerpdu-4ps.netio-products.com:22888]
user = netio
password = netio


[192.168.0.1]
# Reaching a device by IP address means the certificate will not match the
# address, so switch the check off.
cert =
no_cert_warning = true


# A section with a url is a short name for a device. With this you can write
# `Netio -c netio.ini demo GET` instead of typing the whole URL.
[demo]
url = http://powerpdu-8qs.netio-products.com/netio.json
user = netio
password = netio
