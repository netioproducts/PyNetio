name: publish to PyPI

# Publishing happens when a version tag is pushed, for example:
#
#     git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags:
      - "v*"

jobs:
  # Nothing else gates a tagged release on the test suite, so run it here.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: install poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1

      - run: poetry install --no-interaction

      - run: poetry run pytest

  build:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: install poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1

      - name: check that the tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(poetry version --short)"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match project version $version"
            exit 1
          fi

      - run: poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest

    # Needed for trusted publishing, so that no PyPI token has to be stored.
    # Set this up once at https://pypi.org/manage/project/netio/settings/publishing/
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
