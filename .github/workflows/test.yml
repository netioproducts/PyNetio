name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Push already covers branches of this repo; run the pull_request event
    # only for forks, so a PR from a branch does not run the matrix twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: install poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: cache dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: check that pyproject and the lock file agree
        run: poetry check --lock

      - run: poetry install --no-interaction

      - run: poetry run ruff check --output-format=github

      # live tests are excluded.
      - run: poetry run pytest

  live:
    # Talks to the public NETIO demo devices. Informational only: a failure
    # shows up red on this job, but continue-on-error keeps the workflow
    # green, so a downed demo device or a flaky connection blocks nothing.
    continue-on-error: true
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # The tests switch a real output off and on; two runs at once would race.
    concurrency: live-demo-devices
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: install poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: cache dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-3.13-${{ hashFiles('poetry.lock') }}

      - run: poetry install --no-interaction

      - run: poetry run pytest -m live
