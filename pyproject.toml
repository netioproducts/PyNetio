[project]
name = "Netio"
version = "1.0.13"
description = "Interface to control NETIO Products devices"
authors = [{ name = "Adam Verner", email = "averner@netio.eu" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["netio", "pdu", "power switching", "power monitoring", "home automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Power (UPS)",
]
dependencies = [
    "requests>=2.32,<3.0",
]

[project.urls]
Repository = "https://github.com/netioproducts/PyNetio"
Changelog = "https://github.com/netioproducts/PyNetio/blob/master/CHANGELOG.md"

[project.scripts]
Netio = "Netio.cli:main"

[tool.poetry]
# Without this, poetry-core auto-detects the package and lowercases it to
# `netio/`, which breaks `import Netio` on a case sensitive filesystem.
packages = [{ include = "Netio" }]

[tool.poetry.group.test.dependencies]
pytest = "^8.3"
requests-mock = "^1.12"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
